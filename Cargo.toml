[package]
name = "bq27441"
version = "0.1.0"
edition = "2024"
authors = ["Gerzain Mata <leftger@gmail.com>"]
description = "Blocking and async driver for the BQ27441 battery fuel gauge with I2C support"
readme = "README.md"
keywords = ["battery", "fuel-gauge", "i2c", "embedded-hal-driver"]
categories = ["embedded", "hardware-support", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/your-repo/bq27441"

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt-03 = ["dep:defmt", "device-driver/defmt-03"]
embassy = ["async", "defmt-03"]

[dependencies]
device-driver = { version = "1.0", features = ["yaml"], default-features = false }
embedded-hal = "1.0"
embedded-hal-async = { version = "1.0", optional = true }
defmt = { version = "0.3", optional = true }

[build-dependencies]
device-driver-generation = "1.0"
prettyplease = "0.2"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
correctness = "forbid"
suspicious = "forbid"
style = "forbid"
perf = "forbid"
pedantic = "deny"
